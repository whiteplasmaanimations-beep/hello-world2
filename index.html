<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>47 Days Interactive Story</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #0b0f1a;
  color: white;
  text-align: center;
}

button {
  padding: 12px 20px;
  margin: 10px;
  cursor: pointer;
  background: #1f2a44;
  color: white;
  border: none;
  border-radius: 8px;
}

button:hover {
  background: #2e3d66;
}

#container {
  padding: 40px;
  max-width: 700px;
  margin: auto;
}

.fade {
  opacity: 0;
  transition: opacity 0.5s ease;
}

.show {
  opacity: 1;
}
</style>
</head>

<body>

<div id="container">

  <h1>Choose Your Story</h1>

  <button onclick="startGame('athlete')">Olympic Athlete</button>
  <button onclick="startGame('adrift')">47 Days Adrift</button>
  <button onclick="startGame('prisoner')">Prisoner of War</button>

  <div id="story" style="margin-top:30px;"></div>

</div>

<script>

let path = "";
let energy = 5;
let day = 1;

function startGame(choice) {
  path = choice;
  energy = 5;
  day = 1;

  if (choice === "athlete") athleteScene();
  if (choice === "adrift") adriftScene();
  if (choice === "prisoner") prisonerScene();
}

/* ---------------- ATHLETE ---------------- */

function athleteScene() {
  document.getElementById("story").innerHTML = `
    <h2>The Athlete</h2>
    <p>You are running in the 1936 Olympics.</p>
    <button onclick="athleteChoice('push')">Push harder</button>
    <button onclick="athleteChoice('steady')">Stay steady</button>
  `;
}

function athleteChoice(c) {
  if (c === "push") {
    energy--;
    show("You sprint forward. Pain builds.");
  } else {
    show("You keep pace. Safe but unnoticed.");
  }

  checkEndAthlete();
}

function checkEndAthlete() {
  if (energy <= 2) {
    gameOver("You collapse before the finish.");
  } else {
    show("You finish the race. Not first. But remembered.");
  }
}

/* ---------------- ADRIFT ---------------- */

function adriftScene() {
  document.getElementById("story").innerHTML = `
    <h2>47 Days Adrift</h2>
    <p>Day ${day}</p>
    <p>Energy: ${energy}</p>

    <button onclick="adriftChoice('eat')">Eat resource</button>
    <button onclick="adriftChoice('save')">Save it</button>
  `;
}

function adriftChoice(c) {

  if (c === "eat") {
    energy += 2;
    show("You eat. Strength returns.");
  }

  if (c === "save") {
    energy -= 1;
    show("You endure hunger.");
  }

  day++;

  // survival pressure increases over time
  energy--;

  if (day > 47) {
    showEnding("You survived all 47 days. Barely.");
    return;
  }

  if (energy <= 0) {
    gameOver("You didn’t survive the ocean.");
    return;
  }

  setTimeout(adriftScene, 500);
}

/* ---------------- PRISONER ---------------- */

function prisonerScene() {
  document.getElementById("story").innerHTML = `
    <h2>Prisoner of War</h2>
    <p>You are ordered to obey.</p>

    <button onclick="prisonerChoice('obey')">Obey</button>
    <button onclick="prisonerChoice('resist')">Resist</button>
  `;
}

function prisonerChoice(c) {

  if (c === "obey") {
    show("You survive another day.");
  }

  if (c === "resist") {
    energy -= 3;
    show("Punishment. Pain follows.");
  }

  if (energy <= 0) {
    gameOver("You could not endure captivity.");
  } else {
    show("Time passes. No control.");
  }
}

/* ---------------- SYSTEM ---------------- */

function show(text) {
  document.getElementById("story").innerHTML += `<p>${text}</p>`;
}

function gameOver(text) {
  document.getElementById("story").innerHTML = `
    <h2>Failure</h2>
    <p>${text}</p>
    <button onclick="location.reload()">Try again</button>
  `;
}

function showEnding(text) {
  document.getElementById("story").innerHTML = `
    <h2>Ending</h2>
    <p>${text}</p>
    <button onclick="location.reload()">Play again</button>
  `;
}

</script>

</body>
</html>
