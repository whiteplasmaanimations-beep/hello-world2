<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>47 Days Interactive Story</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: linear-gradient(#0b0f1a, #1a2238);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* SKY ELEMENTS */
#sky {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
}

.sun, .moon {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  top: 10%;
  left: -100px;
  animation: moveSky 30s linear infinite;
}

.sun {
  background: radial-gradient(circle, #ffd27f, #ff9800);
  box-shadow: 0 0 40px #ffb347;
}

.moon {
  background: radial-gradient(circle, #ddd, #aaa);
  box-shadow: 0 0 20px #fff;
  animation-delay: 15s;
}

@keyframes moveSky {
  0% { left: -100px; top: 10%; }
  50% { top: 5%; }
  100% { left: 110%; top: 10%; }
}

/* STARS */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.2; }
  to { opacity: 1; }
}

button {
  padding: 12px 20px;
  margin: 10px;
  cursor: pointer;
  background: #1f2a44;
  color: white;
  border: none;
  border-radius: 8px;
  transition: transform 0.2s, background 0.3s;
</html>
