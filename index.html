<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>47 Days Interactive Story</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: linear-gradient(#0b0f1a, #1a2238);
  color: white;
  text-align: center;
  overflow: hidden;
}

/* Animated fog GIF background */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 200%;
  height: 200%;
  background: url("https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif");
  background-size: cover;
  opacity: 0.15;
  animation: moveBg 60s linear infinite;
}

@keyframes moveBg {
  from { transform: translate(0, 0); }
  to { transform: translate(-25%, -25%); }
}

button {
  padding: 12px 20px;
  margin: 10px;
  cursor: pointer;
  background: #1f2a44;
  color: white;
  border: none;
  border-radius: 8px;
  transition: transform 0.2s, background 0.3s;
}

button:hover {
  background: #2e3d66;
  transform: scale(1.1);
}

#container {
  padding: 40px;
  max-width: 700px;
  margin: auto;
}

/* Scene transition */
.fadeScene {
  animation: fadeScene 0.6s ease;
}

@keyframes fadeScene {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Screen shake */
.shake {
  animation: shake 0.3s;
}

@keyframes shake {
  0% { transform: translate(0px, 0px); }
  25% { transform: translate(5px, -5px); }
  50% { transform: translate(-5px, 5px); }
  75% { transform: translate(5px, 5px); }
  100% { transform: translate(0px, 0px); }
}
</style>
</head>

<body>

<div id="container">

  <h1>Choose Your Story</h1>

  <button onclick="startGame('athlete')">Olympic Athlete</button>
  <button onclick="startGame('adrift')">47 Days Adrift</button>
  <button onclick="startGame('prisoner')">Prisoner of War</button>

  <div id="story" style="margin-top:30px;"></div>

</div>

<script>

let path = "";
let energy = 5;
let morale = 5;
let day = 1;

/* TYPEWRITER */
function typeText(text) {
  let i = 0;
  const speed = 20;

  const p = document.createElement("p");
  document.getElementById("story").appendChild(p);

  function typing() {
    if (i < text.length) {
      p.innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, speed);
    }
  }

  typing();
}

/* SCENE WRAPPER */
function setScene(html) {
  const story = document.getElementById("story");
  story.innerHTML = `<div class="fadeScene">${html}</div>`;
}

/* SHAKE */
function shakeScreen() {
  const container = document.getElementById("container");
  container.classList.add("shake");
  setTimeout(() => container.classList.remove("shake"), 300);
}

function startGame(choice) {
  path = choice;
  energy = 5;
  morale = 5;
  day = 1;

  if (choice === "athlete") athleteScene();
  if (choice === "adrift") adriftScene();
  if (choice === "prisoner") prisonerScene();
}

/* ATHLETE */
function athleteScene() {
  setScene(`
    <h2>The Athlete</h2>
    <img src="https://media.giphy.com/media/3o7TKtnuHOHHUjR38Y/giphy.gif" style="width:100%; border-radius:10px;">
    <p>Energy: ${energy} | Morale: ${morale}</p>

    <button onclick="athleteChoice('push')">Sprint</button>
    <button onclick="athleteChoice('pace')">Maintain pace</button>
    <button onclick="athleteChoice('focus')">Focus breathing</button>
  `);

  typeText("Final lap. Your legs burn. The crowd roars.");
}

function athleteChoice(c) {
  if (c === "push") {
    energy -= 2;
    morale += 1;
    typeText("You explode forward. The crowd reacts.");
    shakeScreen();
  }

  if (c === "pace") {
    energy -= 1;
    typeText("You hold steady. Controlled.");
  }

  if (c === "focus") {
    morale += 2;
    energy -= 1;
    typeText("You calm yourself. Mind over body.");
  }

  resolveAthlete();
}

function resolveAthlete() {
  if (energy <= 0) return gameOver("Your body gives out.");

  if (morale >= 8 && energy > 0) {
    showEnding("You surge at the last second and win gold.");
  } else if (energy <= 2) {
    showEnding("You finish, barely standing.");
  } else {
    setTimeout(athleteScene, 1000);
  }
}

/* ADRIFT */
function adriftScene() {
  setScene(`
    <h2>47 Days Adrift</h2>
    <img src="https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif" style="width:100%; border-radius:10px;">
    <p>Day ${day}</p>
    <p>Energy: ${energy} | Morale: ${morale}</p>

    <button onclick="adriftChoice('eat')">Eat</button>
    <button onclick="adriftChoice('fish')">Try fishing</button>
    <button onclick="adriftChoice('rest')">Rest</button>
  `);
}

function adriftChoice(c) {

  if (c === "eat") {
    energy += 2;
    morale += 1;
    typeText("You eat your limited supplies.");
  }

  if (c === "fish") {
    if (Math.random() > 0.5) {
      energy += 3;
      morale += 2;
      typeText("You catch a fish. Hope returns.");
    } else {
      energy -= 2;
      typeText("You fail and waste energy.");
      shakeScreen();
    }
  }

  if (c === "rest") {
    energy += 1;
    morale -= 1;
    typeText("You rest. Time slips away.");
  }

  day++;
  energy--;
  morale--;

  if (day > 47) {
    if (morale > 5) showEnding("You survive and are rescued.");
    else showEnding("You survive, but something inside you is lost.");
    return;
  }

  if (energy <= 0 || morale <= 0) {
    gameOver("The ocean takes everything.");
    return;
  }

  if (Math.random() > 0.7) {
    typeText("A storm hits violently.");
    shakeScreen();
    energy -= 2;
    morale -= 1;
  }

  setTimeout(adriftScene, 1200);
}

/* PRISONER */
function prisonerScene() {
  setScene(`
    <h2>Prisoner of War</h2>
    <img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" style="width:100%; border-radius:10px;">
    <p>Day ${day}</p>
    <p>Energy: ${energy} | Morale: ${morale}</p>

    <button onclick="prisonerChoice('obey')">Obey</button>
    <button onclick="prisonerChoice('resist')">Resist</button>
    <button onclick="prisonerChoice('bond')">Talk</button>
  `);
}

function prisonerChoice(c) {

  if (c === "obey") {
    energy -= 1;
    typeText("You survive quietly.");
  }

  if (c === "resist") {
    energy -= 3;
    morale += 1;
    typeText("You resist. Pain, but pride.");
    shakeScreen();
  }

  if (c === "bond") {
    morale += 2;
    typeText("You share stories. Humanity remains.");
  }

  day++;

  if (energy <= 0) return gameOver("Your body breaks.");
  if (morale <= 0) return gameOver("Your mind collapses.");

  if (day > 10 && morale > 7) {
    showEnding("You organize an escape. Freedom.");
    return;
  }

  typeText("Another day passes under watch.");
  setTimeout(prisonerScene, 1200);
}

/* ENDINGS */
function gameOver(text) {
  setScene(`
    <h2>Failure</h2>
    <button onclick="location.reload()">Try again</button>
  `);
  typeText(text);
}

function showEnding(text) {
  setScene(`
    <h2>Ending</h2>
    <button onclick="location.reload()">Play again</button>
  `);
  typeText(text);
}

</script>

</body>
</html>
