<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>47 Days Interactive Story</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: linear-gradient(#0b0f1a, #1a2238);
  color: white;
  text-align: center;
}

button {
  padding: 12px 20px;
  margin: 10px;
  cursor: pointer;
  background: #1f2a44;
  color: white;
  border: none;
  border-radius: 8px;
  transition: transform 0.2s, background 0.3s;
}

button:hover {
  background: #2e3d66;
  transform: scale(1.1);
}

#container {
  padding: 40px;
  max-width: 700px;
  margin: auto;
}

/* Bars */
.barContainer {
  background: #333;
  border-radius: 10px;
  margin: 10px 0;
  height: 20px;
  overflow: hidden;
}

.barFill {
  height: 100%;
  width: 100%;
  transition: width 0.5s ease;
}

.energy { background: #4caf50; }
.morale { background: #2196f3; }

/* Scene transition */
.fadeScene {
  animation: fadeScene 0.6s ease;
}

@keyframes fadeScene {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Shake */
.shake {
  animation: shake 0.3s;
}

@keyframes shake {
  0% { transform: translate(0, 0); }
  25% { transform: translate(5px, -5px); }
  50% { transform: translate(-5px, 5px); }
  75% { transform: translate(5px, 5px); }
  100% { transform: translate(0, 0); }
}
</style>
</head>

<body>

<div id="container">

  <h1>Choose Your Story</h1>

  <button onclick="startGame('athlete')">Olympic Athlete</button>
  <button onclick="startGame('adrift')">47 Days Adrift</button>
  <button onclick="startGame('prisoner')">Prisoner of War</button>

  <div id="story" style="margin-top:30px;"></div>

</div>

<script>

let energy = 5;
let morale = 5;
let day = 1;

/* TYPE TEXT */
function typeText(text) {
  let i = 0;
  const p = document.createElement("p");
  document.getElementById("story").appendChild(p);

  function typing() {
    if (i < text.length) {
      p.innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, 20);
    }
  }

  typing();
}

/* SCENE */
function setScene(html) {
  document.getElementById("story").innerHTML =
    `<div class="fadeScene">${html}</div>`;
}

/* SHAKE */
function shakeScreen() {
  const c = document.getElementById("container");
  c.classList.add("shake");
  setTimeout(() => c.classList.remove("shake"), 300);
}

/* BARS */
function bars() {
  return `
    <div>
      <p>Energy</p>
      <div class="barContainer">
        <div class="barFill energy" style="width:${energy * 20}%"></div>
      </div>

      <p>Morale</p>
      <div class="barContainer">
        <div class="barFill morale" style="width:${morale * 20}%"></div>
      </div>
    </div>
  `;
}

function startGame(choice) {
  energy = 5;
  morale = 5;
  day = 1;

  if (choice === "athlete") athleteScene();
  if (choice === "adrift") adriftScene();
  if (choice === "prisoner") prisonerScene();
}

/* ATHLETE */
function athleteScene() {
  setScene(`
    <h2>The Athlete</h2>
    ${bars()}
    <button onclick="athleteChoice('push')">Sprint</button>
    <button onclick="athleteChoice('pace')">Maintain pace</button>
    <button onclick="athleteChoice('focus')">Focus breathing</button>
  `);

  typeText("Final lap. Your legs burn. The crowd roars.");
}

function athleteChoice(c) {
  if (c === "push") {
    energy -= 2;
    morale += 1;
    typeText("You explode forward.");
    shakeScreen();
  }

  if (c === "pace") {
    energy -= 1;
    typeText("You hold steady.");
  }

  if (c === "focus") {
    morale += 2;
    energy -= 1;
    typeText("You regain control.");
  }

  resolveAthlete();
}

function resolveAthlete() {
  if (energy <= 0) return gameOver("Your body gives out.");

  if (morale >= 8) {
    showEnding("You win gold.");
  } else if (energy <= 2) {
    showEnding("You finish barely standing.");
  } else {
    setTimeout(athleteScene, 1000);
  }
}

/* ADRIFT */
function adriftScene() {
  setScene(`
    <h2>47 Days Adrift</h2>
    <p>Day ${day}</p>
    ${bars()}
    <button onclick="adriftChoice('eat')">Eat</button>
    <button onclick="adriftChoice('fish')">Fish</button>
    <button onclick="adriftChoice('rest')">Rest</button>
  `);
}

function adriftChoice(c) {

  if (c === "eat") {
    energy += 2;
    morale += 1;
    typeText("You eat supplies.");
  }

  if (c === "fish") {
    if (Math.random() > 0.5) {
      energy += 3;
      morale += 2;
      typeText("You catch a fish.");
    } else {
      energy -= 2;
      typeText("You fail.");
      shakeScreen();
    }
  }

  if (c === "rest") {
    energy += 1;
    morale -= 1;
    typeText("You rest.");
  }

  day++;
  energy--;
  morale--;

  if (day > 47) {
    showEnding("You survive.");
    return;
  }

  if (energy <= 0 || morale <= 0) {
    gameOver("The ocean wins.");
    return;
  }

  setTimeout(adriftScene, 1200);
}

/* PRISONER */
function prisonerScene() {
  setScene(`
    <h2>Prisoner of War</h2>
    <p>Day ${day}</p>
    ${bars()}
    <button onclick="prisonerChoice('obey')">Obey</button>
    <button onclick="prisonerChoice('resist')">Resist</button>
    <button onclick="prisonerChoice('bond')">Talk</button>
  `);
}

function prisonerChoice(c) {

  if (c === "obey") {
    energy -= 1;
    typeText("You endure.");
  }

  if (c === "resist") {
    energy -= 3;
    morale += 1;
    typeText("You resist.");
    shakeScreen();
  }

  if (c === "bond") {
    morale += 2;
    typeText("You connect.");
  }

  day++;

  if (energy <= 0) return gameOver("Your body breaks.");
  if (morale <= 0) return gameOver("Your mind collapses.");

  if (day > 10 && morale > 7) {
    showEnding("You escape.");
    return;
  }

  typeText("Another day passes.");
  setTimeout(prisonerScene, 1200);
}

/* ENDINGS */
function gameOver(text) {
  setScene(`
    <h2>Failure</h2>
    <button onclick="location.reload()">Try again</button>
  `);
  typeText(text);
}

function showEnding(text) {
  setScene(`
    <h2>Ending</h2>
    <button onclick="location.reload()">Play again</button>
  `);
  typeText(text);
}

</script>

</body>
</html>
